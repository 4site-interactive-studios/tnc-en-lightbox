<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>EN Lightbox Smoke Harness</title>
    <style>
      html,
      body {
        margin: 0;
        min-height: 300vh;
      }
      #page-heading {
        margin: 0;
        padding: 1rem;
      }
    </style>
  </head>
  <body>
    <h1 id="page-heading">Smoke harness</h1>
    <button id="page-button" type="button">Page button</button>

    <form method="post" id="en-form" name="pb_test" action="#" class="en__component en__component--page">
      <div class="en__field">
        <div class="en__field__element">
          <input id="en__field_supporter_appealCode" type="text" class="en__field__input en__field__input--text" name="supporter.appealCode" />
        </div>
      </div>
      <div class="en__field">
        <div class="en__field__element">
          <input id="en__field_supporter_emailAddress" type="email" class="en__field__input en__field__input--email" name="supporter.emailAddress" required />
        </div>
      </div>
      <div class="en__submit">
        <button type="submit">Submit</button>
      </div>
    </form>

    <script>
      // Simulate a hostile/opinionated host page: inject arbitrary CSS into the
      // document head BEFORE the lightbox loads. Used by the style-isolation specs.
      ;(() => {
        const hostCss = new URLSearchParams(location.search).get('hostcss')
        if (!hostCss) return
        const style = document.createElement('style')
        style.id = 'hostile-host-css'
        style.textContent = hostCss
        document.head.appendChild(style)
      })()
    </script>
    <script>
      window.ENLightbox = (() => {
        const params = new URLSearchParams(location.search)
        const encoded = params.get('cfg')
        if (encoded) {
          try {
            return JSON.parse(atob(encoded))
          } catch {
            // fall through to default
          }
        }
        return {
          header: 'Smoke header',
          body: 'Smoke body',
          image: { src: 'data:image/gif;base64,R0lGODlhAQABAIAAAAAAAP///yH5BAEAAAAALAAAAAABAAEAAAIBRAA7', alt: '' },
          cta: { label: 'Smoke CTA', href: '#' },
          triggers: { time: 50 },
        }
      })()
    </script>
    <script src="/dist/en-lightbox.js"></script>
  </body>
</html>
