<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>EN Lightbox Carry-over Harness</title>
  </head>
  <body>
    <h1>Destination form</h1>
    <form method="post" id="en-form" name="pb_test" action="#" class="en__component en__component--page">
      <div class="en__field">
        <div class="en__field__element">
          <input id="en__field_supporter_appealCode" type="text" class="en__field__input en__field__input--text" name="supporter.appealCode" />
        </div>
      </div>
      <div class="en__field">
        <div class="en__field__element">
          <input id="en__field_supporter_emailAddress" type="email" class="en__field__input en__field__input--email" name="supporter.emailAddress" required />
        </div>
      </div>
      <div class="en__submit">
        <button type="submit">Submit</button>
      </div>
    </form>

    <script>
      window.ENLightbox = (() => {
        const encoded = new URLSearchParams(location.search).get('cfg')
        if (encoded) {
          try {
            return JSON.parse(atob(encoded))
          } catch {
            // fall through to the inert destination default
          }
        }
        return { en: { referenceField: 'supporter.appealCode' } }
      })()
    </script>
    <script src="/dist/en-lightbox.js"></script>
  </body>
</html>
