name: release

on:
  push:
    branches: [main]

jobs:
  release-please:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    outputs:
      release_created: ${{ steps.rp.outputs.release_created }}
      tag_name: ${{ steps.rp.outputs.tag_name }}
    steps:
      - uses: googleapis/release-please-action@v4
        id: rp
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          release-type: node

      # ── dist-sync: rebuild committed dist on the release PR branch ──────────
      # WHY: release-please bumps package.json via API but does not rebuild
      # dist/en-lightbox.js, so the committed dist's version banner lags one
      # version behind after each release-please update.  The release-qa job
      # uploads a fresh asset to the GitHub Release, but that asset is never
      # committed back.  By rebuilding on the release PR branch, the merged
      # result keeps main's dist/banner consistent with package.json.
      # Ref: issue #53.
      - uses: actions/checkout@v4
        if: ${{ steps.rp.outputs.pr }}
        with:
          ref: ${{ fromJson(steps.rp.outputs.pr).headBranchName }}
          token: ${{ secrets.GITHUB_TOKEN }}
          fetch-depth: 0

      - uses: actions/setup-node@v4
        if: ${{ steps.rp.outputs.pr }}
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        if: ${{ steps.rp.outputs.pr }}
        run: npm ci

      - name: Rebuild and sync committed dist
        if: ${{ steps.rp.outputs.pr }}
        run: |
          git config user.email fern@ndo.io
          git config user.name "Fernando Santos"
          tools/sdd/sync_release_dist.sh --push --expected-branch "${{ fromJson(steps.rp.outputs.pr).headBranchName }}"

  release-qa:
    if: ${{ needs.release-please.outputs.release_created == 'true' }}
    needs: [release-please]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.release-please.outputs.tag_name }}

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - run: npm ci
      - run: npm run build
      - run: npx playwright install --with-deps
      - run: npm run e2e
      - run: node tools/sdd/check_a11y.mjs

      - run: gh release upload "${{ needs.release-please.outputs.tag_name }}" dist/en-lightbox.js --clobber
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
